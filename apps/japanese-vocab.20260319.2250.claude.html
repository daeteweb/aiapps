<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日文單詞記憶卡</title>
  <style>
    :root {
      --bg: #0f0e0c;
      --surface: #1a1915;
      --surface2: #232218;
      --border: #2e2c24;
      --gold: #c9a84c;
      --gold-dim: #7a6330;
      --text: #e8e2d4;
      --text-muted: #6b6455;
      --text-dim: #9a9080;
      --green: #4a9e6a;
      --green-bg: #0d2018;
      --red: #c0503a;
      --red-bg: #200e0a;
      --blue: #4a80c0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 16px 48px;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(201,168,76,0.05), transparent 55%),
        radial-gradient(ellipse at 80% 100%, rgba(74,128,192,0.03), transparent 55%);
    }
    .header {
      width: 100%; max-width: 480px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0 16px;
    }
    .logo {
      font-family: 'Noto Serif JP', serif;
      font-weight: 300; font-size: 1rem;
      color: var(--gold); letter-spacing: 0.3em;
    }
    .icon-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-dim); padding: 7px 12px; border-radius: 4px;
      font-size: 0.72rem; cursor: pointer; letter-spacing: 0.05em;
      font-family: 'Noto Sans TC', sans-serif; transition: all 0.15s;
    }
    .icon-btn:hover { border-color: var(--gold-dim); color: var(--gold); }

    .level-selector {
      width: 100%; max-width: 480px; margin-bottom: 14px;
    }
    .level-label {
      font-size: 0.65rem; color: var(--text-muted); letter-spacing: 0.15em;
      margin-bottom: 8px;
    }
    .level-btns { display: flex; gap: 6px; }
    .level-btn {
      flex: 1; padding: 10px 4px;
      border: 1px solid var(--border); background: var(--surface);
      border-radius: 6px; cursor: pointer; text-align: center;
      transition: all 0.15s; position: relative;
    }
    .level-btn:hover { border-color: var(--gold-dim); }
    .level-btn.active { border-color: var(--gold); background: var(--surface2); }
    .level-btn .lv-name {
      font-family: 'DM Serif Display', serif; font-size: 1rem; color: var(--text-dim);
      display: block; line-height: 1; transition: color 0.15s;
    }
    .level-btn.active .lv-name { color: var(--gold); }
    .level-btn .lv-bar-wrap {
      height: 2px; background: var(--border); border-radius: 1px; margin: 5px 4px 0; overflow: hidden;
    }
    .level-btn .lv-bar { height: 100%; background: var(--green); border-radius: 1px; transition: width 0.4s ease; }
    .level-btn .lv-count {
      font-size: 0.55rem; color: var(--text-muted); letter-spacing: 0.05em; margin-top: 3px; display: block;
    }

    .pool-status {
      width: 100%; max-width: 480px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px 16px; margin-bottom: 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .pool-row { display: flex; justify-content: space-between; align-items: center; }
    .pool-label { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.08em; }
    .pool-numbers { display: flex; gap: 18px; }
    .pool-stat { text-align: center; font-size: 0.68rem; color: var(--text-muted); letter-spacing: 0.05em; line-height: 1.6; }
    .pool-stat strong { display: block; font-size: 1.15rem; font-weight: 500; font-family: 'DM Serif Display', serif; }
    .pool-stat.s-pool strong { color: var(--gold); }
    .pool-stat.s-learned strong { color: var(--green); }
    .pool-stat.s-remain strong { color: var(--text-dim); }
    .pool-bar-track { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; display: flex; }
    .pool-bar-learned { background: var(--green); height: 100%; transition: width 0.4s ease; }
    .pool-bar-again { background: var(--red); height: 100%; transition: width 0.4s ease; }
    .pool-bar-fresh { background: var(--gold-dim); height: 100%; transition: width 0.4s ease; }
    .pool-list-toggle { font-size: 0.68rem; color: var(--text-muted); letter-spacing: 0.08em; cursor: pointer; text-align: center; padding: 4px 0; }
    .pool-list-toggle:hover { color: var(--gold); }
    .pool-list { display: none; flex-wrap: wrap; gap: 5px; max-height: 130px; overflow-y: auto; }
    .pool-list.open { display: flex; }
    .pool-word-chip {
      font-family: 'Noto Serif JP', serif; font-size: 0.8rem; padding: 3px 9px; border-radius: 3px;
      border: 1px solid var(--border); background: var(--surface2); color: var(--text-dim);
    }
    .pool-word-chip.again { border-color: rgba(192,80,58,0.4); color: var(--red); }

    .filter-tabs { width: 100%; max-width: 480px; display: flex; gap: 6px; margin-bottom: 18px; }
    .tab {
      flex: 1; padding: 9px 4px; background: var(--surface); border: 1px solid var(--border);
      color: var(--text-muted); font-family: 'Noto Sans TC', sans-serif; font-size: 0.73rem;
      border-radius: 4px; cursor: pointer; text-align: center; transition: all 0.15s;
    }
    .tab.active { background: var(--surface2); border-color: var(--gold-dim); color: var(--gold); }

    .card-area { width: 100%; max-width: 480px; perspective: 1200px; margin-bottom: 18px; }
    .card-wrapper {
      position: relative; width: 100%; height: 265px; transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.23, 1, 0.32, 1); cursor: pointer;
    }
    .card-wrapper.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; padding: 28px 24px; overflow: hidden;
    }
    .card-front { background: var(--surface); background-image: radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.07), transparent 65%); }
    .card-back { background: var(--surface2); transform: rotateY(180deg); background-image: radial-gradient(ellipse at 50% 100%, rgba(74,128,192,0.07), transparent 65%); }
    .card-corner { position: absolute; top: 13px; right: 15px; font-size: 0.63rem; color: var(--text-muted); letter-spacing: 0.05em; }
    .card-level-badge { position: absolute; top: 13px; left: 50%; transform: translateX(-50%); font-size: 0.6rem; letter-spacing: 0.12em; color: var(--gold-dim); font-family: 'DM Serif Display', serif; }
    .card-category { font-size: 0.63rem; letter-spacing: 0.2em; color: var(--gold-dim); font-family: 'Noto Sans TC', sans-serif; }
    .card-jp { font-family: 'Noto Serif JP', serif; font-size: clamp(44px, 13vw, 68px); font-weight: 300; color: var(--text); line-height: 1; text-align: center; }
    .card-flip-hint { font-size: 0.62rem; color: var(--text-muted); letter-spacing: 0.15em; position: absolute; bottom: 13px; }
    .card-reading { font-family: 'Noto Serif JP', serif; font-size: 1.35rem; color: var(--gold); letter-spacing: 0.1em; }
    .card-meaning { font-size: 1.55rem; font-weight: 500; color: var(--text); letter-spacing: 0.05em; font-family: 'DM Serif Display', serif; }
    .card-romaji { font-size: 0.78rem; color: var(--text-muted); letter-spacing: 0.1em; }
    .status-dot { position: absolute; top: 13px; left: 15px; width: 7px; height: 7px; border-radius: 50%; background: transparent; border: 1.5px solid var(--border); transition: all 0.3s; }
    .status-dot.again { background: var(--red); border-color: var(--red); }
    .new-badge { position: absolute; top: 13px; left: 24px; font-size: 0.58rem; letter-spacing: 0.12em; color: var(--blue); border: 1px solid var(--blue); border-radius: 3px; padding: 2px 5px; opacity: 0; transition: opacity 0.3s; }
    .new-badge.show { opacity: 1; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(28px) scale(0.96); } to { opacity: 1; transform: translateX(0) scale(1); } }
    .card-area.animate { animation: slideIn 0.32s cubic-bezier(0.23,1,0.32,1); }

    .actions { width: 100%; max-width: 480px; display: flex; gap: 10px; margin-bottom: 18px; }
    .action-btn { flex: 1; padding: 15px; border-radius: 6px; border: 1px solid; font-family: 'Noto Sans TC', sans-serif; font-size: 0.82rem; cursor: pointer; letter-spacing: 0.05em; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-learned { background: var(--green-bg); border-color: var(--green); color: var(--green); }
    .btn-learned:hover { background: var(--green); color: #fff; }
    .btn-again { background: var(--red-bg); border-color: var(--red); color: var(--red); }
    .btn-again:hover { background: var(--red); color: #fff; }
    .btn-skip { background: var(--surface); border-color: var(--border); color: var(--text-muted); flex: 0.55; }
    .btn-skip:hover { border-color: var(--text-dim); color: var(--text); }

    .session-info { width: 100%; max-width: 480px; display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--text-muted); letter-spacing: 0.05em; padding: 0 2px; }
    .session-info span { color: var(--text-dim); }

    .empty-state { width: 100%; max-width: 480px; text-align: center; padding: 60px 24px; border: 1px dashed var(--border); border-radius: 12px; display: none; }
    .empty-state .big { font-family: 'Noto Serif JP', serif; font-size: 3rem; color: var(--gold); margin-bottom: 16px; }
    .empty-state p { color: var(--text-muted); font-size: 0.85rem; line-height: 1.8; }
    .empty-refill { margin-top: 20px; padding: 12px 24px; background: transparent; border: 1px solid var(--gold-dim); color: var(--gold); border-radius: 6px; font-family: 'Noto Sans TC', sans-serif; font-size: 0.8rem; cursor: pointer; }
    .empty-refill:hover { background: var(--gold); color: var(--bg); }

    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto; }
    .modal h2 { font-family: 'Noto Serif JP', serif; font-size: 1rem; color: var(--gold); margin-bottom: 18px; letter-spacing: 0.1em; }
    .modal-section { margin-bottom: 16px; }
    .modal-section-label { font-size: 0.68rem; color: var(--text-muted); letter-spacing: 0.1em; margin-bottom: 8px; }
    .modal-row { display: flex; gap: 10px; }
    .modal-btn { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-dim); font-family: 'Noto Sans TC', sans-serif; font-size: 0.78rem; cursor: pointer; }
    .modal-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
    .modal-btn.danger { border-color: var(--red); color: var(--red); background: var(--red-bg); }
    .modal-btn.danger:hover { background: var(--red); color: #fff; }
    .modal-stats { font-size: 0.78rem; color: var(--text-muted); line-height: 2.1; letter-spacing: 0.03em; border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; background: var(--bg); margin-top: 6px; }
    .modal-stats span { color: var(--text-dim); }
    .modal-close { width: 100%; padding: 12px; margin-top: 14px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-family: 'Noto Sans TC', sans-serif; font-size: 0.8rem; cursor: pointer; }
    .slider-row { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
    .slider-row input[type=range] { flex: 1; accent-color: var(--gold); }
    .slider-val { font-size: 0.85rem; color: var(--gold); min-width: 28px; text-align: right; font-family: 'DM Serif Display', serif; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">単語帳</div>
    <button class="icon-btn" onclick="openModal()">⚙ 選項</button>
  </div>

  <div class="level-selector">
    <div class="level-label">JLPT 單字池</div>
    <div class="level-btns" id="level-btns">
      <div class="level-btn" id="lvbtn-N5" onclick="setLevel('N5')"><span class="lv-name">N5</span><div class="lv-bar-wrap"><div class="lv-bar" id="lvbar-N5" style="width:0%"></div></div><span class="lv-count" id="lvcount-N5">0/0</span></div>
      <div class="level-btn" id="lvbtn-N4" onclick="setLevel('N4')"><span class="lv-name">N4</span><div class="lv-bar-wrap"><div class="lv-bar" id="lvbar-N4" style="width:0%"></div></div><span class="lv-count" id="lvcount-N4">0/0</span></div>
      <div class="level-btn" id="lvbtn-N3" onclick="setLevel('N3')"><span class="lv-name">N3</span><div class="lv-bar-wrap"><div class="lv-bar" id="lvbar-N3" style="width:0%"></div></div><span class="lv-count" id="lvcount-N3">0/0</span></div>
      <div class="level-btn" id="lvbtn-N2" onclick="setLevel('N2')"><span class="lv-name">N2</span><div class="lv-bar-wrap"><div class="lv-bar" id="lvbar-N2" style="width:0%"></div></div><span class="lv-count" id="lvcount-N2">0/0</span></div>
      <div class="level-btn" id="lvbtn-N1" onclick="setLevel('N1')"><span class="lv-name">N1</span><div class="lv-bar-wrap"><div class="lv-bar" id="lvbar-N1" style="width:0%"></div></div><span class="lv-count" id="lvcount-N1">0/0</span></div>
    </div>
  </div>

  <div class="pool-status">
    <div class="pool-row">
      <div class="pool-label" id="pool-level-label">學習池</div>
      <div class="pool-numbers">
        <div class="pool-stat s-pool"><strong id="stat-pool">0</strong>池中</div>
        <div class="pool-stat s-learned"><strong id="stat-learned">0</strong>已學會</div>
        <div class="pool-stat s-remain"><strong id="stat-total">0</strong>總單詞</div>
      </div>
    </div>
    <div class="pool-bar-track">
      <div class="pool-bar-learned" id="bar-learned" style="width:0%"></div>
      <div class="pool-bar-again" id="bar-again" style="width:0%"></div>
      <div class="pool-bar-fresh" id="bar-fresh" style="width:0%"></div>
    </div>
    <div class="pool-list-toggle" onclick="togglePoolList()">▾ 查看池中單詞</div>
    <div class="pool-list" id="pool-list"></div>
  </div>

  <div class="filter-tabs">
    <div class="tab active" onclick="setFilter('pool')" id="tab-pool">學習池</div>
    <div class="tab" onclick="setFilter('learned')" id="tab-learned">已學會</div>
    <div class="tab" onclick="setFilter('all')" id="tab-all">全部</div>
  </div>

  <div class="card-area" id="card-area">
    <div class="card-wrapper" id="card-wrapper" onclick="flipCard()">
      <div class="card-face card-front">
        <div class="status-dot" id="status-dot"></div>
        <div class="new-badge" id="new-badge">NEW</div>
        <div class="card-corner" id="card-corner">—</div>
        <div class="card-level-badge" id="card-level-badge">N5</div>
        <div class="card-category" id="card-category">—</div>
        <div class="card-jp" id="card-jp">—</div>
        <div class="card-flip-hint">點擊翻面</div>
      </div>
      <div class="card-face card-back">
        <div class="card-corner" id="card-corner-back">—</div>
        <div class="card-reading" id="card-reading">—</div>
        <div class="card-meaning" id="card-meaning">—</div>
        <div class="card-romaji" id="card-romaji">—</div>
      </div>
    </div>
  </div>

  <div class="empty-state" id="empty-state">
    <div class="big" id="empty-icon">✨</div>
    <p id="empty-msg">這輪看完了！</p>
    <button class="empty-refill" id="empty-btn" onclick="handleEmptyBtn()">再來一輪</button>
  </div>

  <div class="actions" id="actions">
    <button class="action-btn btn-again" onclick="markAgain()">✗ 還沒會</button>
    <button class="action-btn btn-skip" onclick="nextCard()">跳過</button>
    <button class="action-btn btn-learned" onclick="markLearned()">✓ 學會了</button>
  </div>

  <div class="session-info">
    <div>本輪剩餘 <span id="remain-count">—</span></div>
    <div>本次學會 <span id="session-learned">0</span></div>
  </div>

  <div class="modal-bg" id="modal-bg" onclick="closeModalBg(event)">
    <div class="modal">
      <h2>⚙ 設定與進度</h2>
      <div class="modal-section">
        <div class="modal-section-label">學習池大小（目前 <span id="pool-size-cur">20</span> 個）</div>
        <div class="slider-row">
          <input type="range" id="pool-size-slider" min="5" max="50" value="20" oninput="updatePoolSizeDisplay(this.value)" />
          <div class="slider-val" id="pool-size-display">20</div>
        </div>
      </div>
      <div class="modal-section">
        <div class="modal-section-label">進度備份（目前等級）</div>
        <div class="modal-row">
          <button class="modal-btn" onclick="exportProgress()">📤 匯出 JSON</button>
          <button class="modal-btn" onclick="document.getElementById('import-file').click()">📥 匯入 JSON</button>
          <input type="file" id="import-file" accept=".json" style="display:none" onchange="importProgress(event)" />
        </div>
      </div>
      <div class="modal-section">
        <div class="modal-section-label">重置</div>
        <div class="modal-row">
          <button class="modal-btn danger" onclick="resetCurrentLevel()">🗑 重置此等級進度</button>
          <button class="modal-btn danger" onclick="resetAllLevels()">🗑 重置全部進度</button>
        </div>
      </div>
      <div class="modal-stats" id="modal-stats"></div>
      <button class="modal-close" onclick="closeModal()">套用並關閉</button>
    </div>
  </div>

  <script>
    const LEVEL_ORDER = ['N5', 'N4', 'N3', 'N2', 'N1'];
    const WORD_DB = {

        { id: 'N5_024', jp: '車', read: 'くるま', rom: 'kuruma', zh: '車', cat: '交通' },
        { id: 'N5_025', jp: '自転車', read: 'じてんしゃ', rom: 'jitensha', zh: '腳踏車', cat: '交通' },
        { id: 'N5_026', jp: '今日', read: 'きょう', rom: 'kyou', zh: '今天', cat: '時間' },

    const STORAGE_KEY = 'japanese-vocab-progress';
    const state = {
      currentLevel: 'N5',
      filter: 'pool',
      poolSize: 20,
      learned: {},
      again: {},
      visited: {},
      seen: {},
      currentIdx: 0,
      currentCards: [],
      flipped: false,
      poolOpen: false,
      sessionLearned: 0
    };

    function getLevelWords(level) {
      return WORD_DB[level] || [];
    }

    function getProgressFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { learned: {}, again: {}, visited: {}, seen: {} };
        return JSON.parse(raw);
      } catch (e) {
        return { learned: {}, again: {}, visited: {}, seen: {} };
      }
    }

    function saveProgress() {
      const payload = {
        learned: state.learned,
        again: state.again,
        visited: state.visited,
        seen: state.seen,
        poolSize: state.poolSize,
        currentLevel: state.currentLevel
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }

    function loadProgress() {
      const progress = getProgressFromStorage();
      state.learned = progress.learned || {};
      state.again = progress.again || {};
      state.visited = progress.visited || {};
      state.seen = progress.seen || {};
      state.poolSize = Number(progress.poolSize || 20);
      if (progress.currentLevel && LEVEL_ORDER.includes(progress.currentLevel)) {
        state.currentLevel = progress.currentLevel;
      }
      document.getElementById('pool-size-slider').value = state.poolSize;
      document.getElementById('pool-size-display').textContent = String(state.poolSize);
      document.getElementById('pool-size-cur').textContent = String(state.poolSize);
    }

    function normalizeWord(item) {
      return {
        id: item.id,
        jp: item.jp,
        read: item.read,
        rom: item.rom,
        zh: item.zh,
        cat: item.cat || '一般'
      };
    }

    function getCardsForLevel(level) {
      const words = getLevelWords(level).map(normalizeWord);
      return words.filter((word) => word && word.id);
    }

    function getFilteredCards() {
      const words = getCardsForLevel(state.currentLevel);
      const learnedMap = state.learned;
      const againMap = state.again;
      const filtered = words.filter((word) => {
        if (state.filter === 'learned') return !!learnedMap[word.id];
        if (state.filter === 'pool') return !(learnedMap[word.id] || againMap[word.id]);
        return true;
      });
      return filtered;
    }

    function shuffle(list) {
      const arr = [...list];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildDeck() {
      let cards = getFilteredCards();
      const learnedSet = state.learned;
      const againSet = state.again;
      const deck = cards.filter((word) => !learnedSet[word.id] && !againSet[word.id]);
      const againWords = cards.filter((word) => againSet[word.id]);
      const learnedWords = cards.filter((word) => learnedSet[word.id]);
      const result = [...shuffle(deck), ...shuffle(againWords), ...shuffle(learnedWords)];
      state.currentCards = result.slice(0, state.poolSize);
      if (state.currentCards.length === 0) {
        state.currentIdx = 0;
      } else {
        state.currentIdx = 0;
      }
    }

    function renderLevelButtons() {
      LEVEL_ORDER.forEach((level) => {
        const levelWords = getCardsForLevel(level);
        const learnedCount = levelWords.filter((word) => state.learned[word.id]).length;
        const total = levelWords.length;
        const percent = total ? (learnedCount / total) * 100 : 0;
        const btn = document.getElementById(`lvbtn-${level}`);
        const bar = document.getElementById(`lvbar-${level}`);
        const count = document.getElementById(`lvcount-${level}`);
        if (btn) btn.classList.toggle('active', state.currentLevel === level);
        if (bar) bar.style.width = `${percent}%`;
        if (count) count.textContent = `${learnedCount}/${total}`;
      });
    }

    function renderStats() {
      const levelWords = getCardsForLevel(state.currentLevel);
      const learnedCount = levelWords.filter((word) => state.learned[word.id]).length;
      const poolCount = levelWords.filter((word) => !(state.learned[word.id] || state.again[word.id])).length;
      const total = levelWords.length;
      document.getElementById('pool-level-label').textContent = `${state.currentLevel} 學習池`;
      document.getElementById('stat-pool').textContent = String(poolCount);
      document.getElementById('stat-learned').textContent = String(learnedCount);
      document.getElementById('stat-total').textContent = String(total);
      const progress = total ? (learnedCount / total) * 100 : 0;
      document.getElementById('bar-learned').style.width = `${progress}%`;
      document.getElementById('bar-again').style.width = '0%';
      document.getElementById('bar-fresh').style.width = `${Math.max(0, 100 - progress)}%`;
      document.getElementById('remain-count').textContent = String(Math.max(0, state.currentCards.length - state.currentIdx));
      document.getElementById('session-learned').textContent = String(state.sessionLearned);
    }

    function renderFilterTabs() {
      document.getElementById('tab-pool').classList.toggle('active', state.filter === 'pool');
      document.getElementById('tab-learned').classList.toggle('active', state.filter === 'learned');
      document.getElementById('tab-all').classList.toggle('active', state.filter === 'all');
    }

    function renderPoolList() {
      const list = document.getElementById('pool-list');
      const words = getCardsForLevel(state.currentLevel);
      const items = words.map((word) => {
        const className = state.again[word.id] ? 'pool-word-chip again' : 'pool-word-chip';
        return ` <span class="${className}">${word.jp}</span> `;
      });
      list.innerHTML = items.join('');
    }

    function renderCard() {
      const card = state.currentCards[state.currentIdx];
      const wrapper = document.getElementById('card-wrapper');
      const front = document.getElementById('card-jp');
      const backMeaning = document.getElementById('card-meaning');
      const backReading = document.getElementById('card-reading');
      const backRomaji = document.getElementById('card-romaji');
      const cat = document.getElementById('card-category');
      const corner = document.getElementById('card-corner');
      const cornerBack = document.getElementById('card-corner-back');
      const levelBadge = document.getElementById('card-level-badge');
      const dot = document.getElementById('status-dot');
      const badge = document.getElementById('new-badge');

      wrapper.classList.remove('flipped');
      state.flipped = false;
      if (!card) {
        front.textContent = '—';
        backMeaning.textContent = '—';
        backReading.textContent = '—';
        backRomaji.textContent = '—';
        cat.textContent = '—';
        corner.textContent = '—';
        cornerBack.textContent = '—';
        levelBadge.textContent = state.currentLevel;
        dot.classList.remove('again');
        badge.classList.remove('show');
        document.getElementById('empty-state').style.display = 'block';
        document.getElementById('actions').style.display = 'none';
        return;
      }

      document.getElementById('empty-state').style.display = 'none';
      document.getElementById('actions').style.display = 'flex';

      front.textContent = card.jp;
      backMeaning.textContent = card.zh;
      backReading.textContent = card.read;
      backRomaji.textContent = `${card.rom} · ${card.cat}`;
      cat.textContent = card.cat;
      corner.textContent = `${state.currentLevel}`;
      cornerBack.textContent = `${state.currentLevel}`;
      levelBadge.textContent = state.currentLevel;
      if (state.seen[card.id]) badge.classList.add('show'); else badge.classList.remove('show');
      if (state.again[card.id]) dot.classList.add('again'); else dot.classList.remove('again');
      state.seen[card.id] = true;
      saveProgress();
    }

    function updateCards() {
      buildDeck();
      renderCard();
      renderStats();
      renderFilterTabs();
      renderPoolList();
      renderLevelButtons();
    }

    function setLevel(level) {
      state.currentLevel = level;
      state.filter = 'pool';
      state.sessionLearned = 0;
      state.currentIdx = 0;
      buildDeck();
      renderCard();
      renderStats();
      renderFilterTabs();
      renderPoolList();
      renderLevelButtons();
      saveProgress();
    }

    function setFilter(filter) {
      state.filter = filter;
      state.currentIdx = 0;
      buildDeck();
      renderCard();
      renderStats();
      renderFilterTabs();
      renderPoolList();
      saveProgress();
    }

    function flipCard() {
      const wrapper = document.getElementById('card-wrapper');
      if (!state.currentCards[state.currentIdx]) return;
      state.flipped = !state.flipped;
      wrapper.classList.toggle('flipped', state.flipped);
    }

    function markLearned() {
      const card = state.currentCards[state.currentIdx];
      if (!card) return;
      state.learned[card.id] = true;
      delete state.again[card.id];
      state.sessionLearned += 1;
      saveProgress();
      nextCard();
    }

    function markAgain() {
      const card = state.currentCards[state.currentIdx];
      if (!card) return;
      state.again[card.id] = true;
      delete state.learned[card.id];
      saveProgress();
      nextCard();
    }

    function nextCard() {
      if (!state.currentCards.length) {
        renderCard();
        return;
      }
      state.currentIdx += 1;
      if (state.currentIdx >= state.currentCards.length) {
        state.currentIdx = 0;
      }
      renderCard();
      renderStats();
      renderPoolList();
    }

    function handleEmptyBtn() {
      state.currentIdx = 0;
      state.sessionLearned = 0;
      buildDeck();
      renderCard();
      renderStats();
    }

    function openModal() {
      document.getElementById('modal-bg').classList.add('open');
      updateModalStats();
    }

    function closeModal() {
      document.getElementById('modal-bg').classList.remove('open');
      saveProgress();
    }

    function closeModalBg(event) {
      if (event.target.id === 'modal-bg') {
        closeModal();
      }
    }

    function updatePoolSizeDisplay(value) {
      const number = Number(value);
      state.poolSize = number;
      document.getElementById('pool-size-display').textContent = String(number);
      document.getElementById('pool-size-cur').textContent = String(number);
      saveProgress();
    }

    function updateModalStats() {
      const levelWords = getCardsForLevel(state.currentLevel);
      const learnedCount = levelWords.filter((word) => state.learned[word.id]).length;
      const againCount = levelWords.filter((word) => state.again[word.id]).length;
      const total = levelWords.length;
      document.getElementById('modal-stats').innerHTML = `
        <div><span>目前等級：</span>${state.currentLevel}</div>
        <div><span>總字數：</span>${total}</div>
        <div><span>已學會：</span>${learnedCount}</div>
        <div><span>待複習：</span>${againCount}</div>
      `;
    }

    function exportProgress() {
      const obj = getProgressFromStorage();
      const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `japanese-vocab-${state.currentLevel}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function importProgress(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          state.learned = data.learned || {};
          state.again = data.again || {};
          state.visited = data.visited || {};
          state.seen = data.seen || {};
          state.poolSize = Number(data.poolSize || state.poolSize);
          if (data.currentLevel && LEVEL_ORDER.includes(data.currentLevel)) {
            state.currentLevel = data.currentLevel;
          }
          document.getElementById('pool-size-slider').value = state.poolSize;
          document.getElementById('pool-size-display').textContent = String(state.poolSize);
          document.getElementById('pool-size-cur').textContent = String(state.poolSize);
          saveProgress();
          updateCards();
        } catch (err) {
          alert('匯入 JSON 失敗，請確認檔案格式正確。');
        }
      };
      reader.readAsText(file);
    }

    function resetCurrentLevel() {
      const words = getCardsForLevel(state.currentLevel);
      words.forEach((word) => {
        delete state.learned[word.id];
        delete state.again[word.id];
        delete state.seen[word.id];
      });
      saveProgress();
      updateCards();
    }

    function resetAllLevels() {
      state.learned = {};
      state.again = {};
      state.seen = {};
      state.visited = {};
      saveProgress();
      updateCards();
    }

    loadProgress();
    renderFilterTabs();
    renderLevelButtons();
    updateCards();
    updateModalStats();
  </script>
</body>
</html>
