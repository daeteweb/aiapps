<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字直排轉換器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-indigo-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <header class="w-full bg-white shadow-sm py-4 px-6 mb-6">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <h1 class="text-xl font-bold text-indigo-600 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                </svg>
                文字直排轉換器
            </h1>
            <span class="text-xs text-slate-400 bg-slate-100 px-2.5 py-1 rounded-full">一鍵直書</span>
        </div>
    </header>

    <main class="flex-grow max-w-2xl w-full mx-auto px-4 sm:px-6 mb-8">
        <div class="bg-white rounded-2xl shadow-xl p-5 sm:p-8 space-y-6 border border-slate-100">
            
            <!-- Input Area -->
            <div>
                <label for="inputText" class="block text-sm font-medium text-slate-700 mb-2 flex justify-between items-center">
                    <span>輸入橫向文字</span>
                    <button id="clearBtn" class="text-xs text-rose-500 hover:text-rose-700 transition">清空內容</button>
                </label>
                <textarea id="inputText" rows="4" 
                    class="w-full p-4 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-slate-700 placeholder:text-slate-300 text-base resize-none"
                    placeholder="請在此輸入要轉換的文字（支援中英文、表情符號等）..."></textarea>
            </div>

            <!-- Options / Stats -->
            <div class="flex items-center justify-between text-xs text-slate-500 px-1">
                <span id="charCount">字數：0</span>
                <span class="text-indigo-500 font-medium">✨ 自動即時轉換</span>
            </div>

            <!-- Output Area -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="outputText" class="text-sm font-medium text-slate-700">直排輸出結果（一字一行）</label>
                    <button id="copyBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-4 py-2 rounded-xl shadow-md hover:shadow-lg transition flex items-center gap-1.5 active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                        </svg>
                        一鍵複製
                    </button>
                </div>
                <textarea id="outputText" rows="8" readonly
                    class="w-full p-4 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-slate-800 placeholder:text-slate-300 text-base font-mono resize-y"
                    placeholder="轉換後的直排文字將顯示在這裡..."></textarea>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-5 py-3 rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none transform translate-y-4 z-50 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        <span id="toastMessage">複製成功！</span>
    </div>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-xs text-slate-400 border-t border-slate-200/60 bg-white">
        文字直排轉換工具 &copy; 2026
    </footer>

    <script>
        // DOM Elements
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const charCount = document.getElementById('charCount');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        // Real-time conversion logic
        function convertText() {
            const val = inputText.value;
            charCount.textContent = `字數：${val.length}`;
            
            if (!val) {
                outputText.value = '';
                return;
            }

            // Convert string into vertical format (one character per line)
            // Array.from handles surrogate pairs / emojis correctly compared to split('')
            const chars = Array.from(val);
            outputText.value = chars.join('\n');
        }

        inputText.addEventListener('input', convertText);

        // Clear button handler
        clearBtn.addEventListener('click', () => {
            inputText.value = '';
            outputText.value = '';
            charCount.textContent = '字數：0';
            inputText.focus();
        });

        // Copy button handler using document.execCommand for sandbox/iframe compatibility
        copyBtn.addEventListener('click', () => {
            if (!outputText.value) {
                showToast('沒有可複製的文字！', true);
                return;
            }

            outputText.select();
            outputText.setSelectionRange(0, 99999); // For mobile devices

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('已成功複製直排文字！');
                } else {
                    showToast('複製失敗，請手動複製', true);
                }
            } catch (err) {
                showToast('複製失敗，請手動複製', true);
            }
        });

        // Toast notification helper
        let toastTimeout;
        function showToast(message, isError = false) {
            toastMessage.textContent = message;
            if (isError) {
                toast.classList.remove('bg-slate-900');
                toast.classList.add('bg-rose-600');
            } else {
                toast.classList.remove('bg-rose-600');
                toast.classList.add('bg-slate-900');
            }

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 2500);
        }
    </script>
</body>
</html>
