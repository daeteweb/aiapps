<head>

<title>StarTracker 離線星空星圖</title>
<style>
:root {
  --bg-deep: #03050c;
  --bg-surface: rgba(10,18,42,0.82);
  --bg-glass: rgba(14,24,52,0.62);
  --bg-glass2: rgba(12,22,48,0.45);
  --gb: rgba(60,90,160,0.2);
  --text: #e8edf5;
  --text2: #8fa8d0;
  --text3: #4d6a92;
  --accent: #f0c060;
  --accent2: #6ea8ff;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; background:var(--bg-deep); color:var(--text); font-family:-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
#app { display:flex; flex-direction:column; height:100vh; }
header { padding:10px 18px; background:var(--bg-surface); border-bottom:1px solid var(--gb); backdrop-filter:blur(12px); }
header h1 { margin:0; font-size:17px; font-weight:700; color:var(--accent); letter-spacing:1px; }
header .sub { font-size:12px; color:var(--text3); margin-top:1px; }
#controls { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:flex-end; padding:10px 16px; background:var(--bg-glass); border-bottom:1px solid var(--gb); backdrop-filter:blur(8px); }
.field { display:flex; flex-direction:column; gap:3px; }
.field label { font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:.8px; font-weight:600; }
.field input,.field select { background:rgba(6,10,24,0.7); color:var(--text); border:1px solid var(--gb); border-radius:8px; padding:6px 10px; font-size:13px; min-width:56px; transition:border-color .15s,box-shadow .15s; }
.field input:focus,.field select:focus { outline:none; border-color:var(--accent2); box-shadow:0 0 0 2px rgba(110,168,255,.2); }
.field input[type=range] { padding:0; min-width:90px; accent-color:var(--accent); }
#toggles { display:flex; gap:5px; padding:5px 16px; background:var(--bg-glass2); border-bottom:1px solid var(--gb); flex-wrap:wrap; }
.tog-btn { background:rgba(30,50,90,0.4); color:var(--text2); border:1px solid var(--gb); border-radius:6px; padding:3px 10px; font-size:11px; cursor:pointer; transition:all .15s; user-select:none; }
.tog-btn:hover { background:rgba(50,80,140,0.5); }
.tog-btn.on { background:rgba(60,100,200,0.35); color:var(--accent2); border-color:var(--accent2); }
#mapWrap { flex:1; position:relative; overflow:hidden; background:radial-gradient(ellipse at 50% 50%,#0a1428 0%,#020408 100%); }
svg { width:100%; height:100%; display:block; }
#timeBar { display:flex; align-items:center; gap:10px; padding:8px 16px; background:var(--bg-glass); border-top:1px solid var(--gb); backdrop-filter:blur(8px); }
#timeBar input[type=range] { flex:1; accent-color:var(--accent); height:6px; }
#clock { font-variant-numeric:tabular-nums; font-size:16px; font-weight:700; color:var(--accent); min-width:62px; text-align:center; letter-spacing:.5px; }
#nowBtn { background:rgba(240,192,96,.15); color:var(--accent); border:1px solid rgba(240,192,96,.3); border-radius:6px; padding:4px 10px; font-size:11px; cursor:pointer; transition:all .15s; white-space:nowrap; }
#nowBtn:hover { background:rgba(240,192,96,.25); }
#infoBar { display:flex; gap:16px; padding:5px 16px; background:var(--bg-glass2); font-size:11px; color:var(--text3); flex-wrap:wrap; }
#infoBar span { white-space:nowrap; }
#infoBar b { color:var(--text2); font-weight:600; }
.hint { font-size:11px; color:var(--text3); }
.star-label { font-size: calc(9px * var(--fs,1)); fill:#a0bce8; pointer-events:all; cursor:pointer; transition:font-size .12s; }
.planet-label { font-size: calc(10px * var(--fs,1)); font-weight:600; pointer-events:all; cursor:pointer; transition:font-size .12s; }
.con-label { font-size: calc(12px * var(--fs,1)); fill:#4a6a9a; font-weight:700; pointer-events:all; cursor:pointer; text-anchor:middle; transition:font-size .12s, fill .12s; }
.grid-label { font-size:9px; fill:#3a5a7a; pointer-events:none; }
.con-line.highlight { stroke:#7aafe0 !important; stroke-width:2.5 !important; opacity:1 !important; }
text.label-zoom { font-size: calc(20px * var(--fs,1)) !important; fill:#fff !important; }
svg { width:100%; height:100%; display:block; cursor:grab; }
svg.grabbing { cursor:grabbing; }
#mapWrap.fs { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:999; }
#app.fs header,#app.fs #controls,#app.fs #toggles,#app.fs #timeBar,#app.fs #infoBar { display:none; }
#fsBtn { position:absolute; top:8px; right:8px; z-index:10; background:rgba(20,40,80,.55); color:var(--text2); border:1px solid var(--gb); border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer; backdrop-filter:blur(4px); transition:all .15s; }
#fsBtn:hover { background:rgba(40,70,120,.7); color:var(--text); }
.legend { position:absolute; top:10px; left:10px; font-size:11px; color:var(--text3); background:rgba(8,12,24,.55); padding:6px 10px; border-radius:8px; border:1px solid var(--gb); line-height:1.6; backdrop-filter:blur(6px); }
.legend b { color:var(--text); }
@media (max-width:640px) { #controls { gap:6px 10px; padding:8px 10px; } .field input,.field select { font-size:12px; padding:5px 7px; } #toggles { padding:4px 10px; } #infoBar { font-size:10px; gap:10px; } #controls .wide { display:none; } }
</style>
</head>
<body>
<div id="app">
<header>
  <h1>StarTracker · 離線星空星圖</h1>
  <div class="sub">設定日期與地點，拖拉時間滑桿觀察星空移動（南方為中心）</div>
</header>

<div id="controls">
  <div class="field"><label>年</label><input id="year" type="number" value="2026" min="1900" max="2100"></div>
  <div class="field"><label>月</label><input id="month" type="number" value="7" min="1" max="12"></div>
  <div class="field"><label>日</label><input id="day" type="number" value="18" min="1" max="31"></div>
  <div class="field"><label>城市</label><select id="city"></select></div>
  <div class="field"><label>經度 (°)</label><input id="lon" type="number" value="121.5" step="0.01"></div>
  <div class="field"><label>緯度 (°)</label><input id="lat" type="number" value="25.0" step="0.01"></div>
  <div class="field"><label>視星等</label><input id="magLimit" type="range" min="1" max="6.5" step="0.1" value="6.0"></div>
  <div class="field"><label></label><span class="hint" id="magVal">6.0</span></div>
  <div class="field"><label>語言</label><select id="lang"><option value="cn">中文</option><option value="en">EN</option></select></div>
</div>

<div id="toggles">
  <span class="tog-btn on" data-toggle="grid">網格</span>
  <span class="tog-btn on" data-toggle="lines">星座線</span>
  <span class="tog-btn on" data-toggle="labels">標籤</span>
  <span class="tog-btn on" data-toggle="names">星座名</span>
  <span class="tog-btn on" data-toggle="planets">行星</span>
  <span class="hint" style="margin-left:auto">← →±10分 · ↑↓星等 · GLC快捷</span>
</div>

<div id="mapWrap">
  <svg id="sky" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="legend" id="legend"></div>
  <button id="fsBtn">⛶ 全螢幕</button>
</div>

<div id="timeBar">
  <span class="hint">00:00</span>
  <input id="time" type="range" min="0" max="1440" step="1">
  <span class="hint">24:00</span>
  <span id="clock">21:00</span>
  <button id="nowBtn">現在時間</button>
</div>

<div id="infoBar">
  <span>地方恆星時 (LST) <b id="lstVal">--</b></span>
  <span>可見恆星 <b id="starCount">0</b></span>
  <span id="moonInfo"></span>
</div>
</div>

function julianDay(y,m,d,ut){if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);const jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;return jd+ut/24}
function julianCenturies(jd){return(jd-2451545)/36525}
function gmstDeg(jd){const T=julianCenturies(jd);return norm360(280.46061837+360.98564736629*(jd-2451545)+0.000387933*T*T-T*T*T/38710000)}
function localSiderealTime(jd,lon){return norm360(gmstDeg(jd)+lon)}
function eqToHorizon(ra,d,lst,lat){const H=(lst-ra)*D2R,dd=d*D2R,p=lat*D2R;const sa=sin(dd)*sin(p)+cos(dd)*cos(p)*cos(H);const alt=Math.asin(Math.max(-1,Math.min(1,sa)));let az=atan2(-cos(dd)*cos(p)*sin(H),sin(dd)-sin(p)*sa);return{alt:alt*R2D,az:norm360(az*R2D)}}
function eclToEq(l,b){const ob=23.4393;const lr=l*D2R,br=b*D2R;const e=ob*D2R;const d=Math.asin(sin(br)*cos(e)+cos(br)*sin(e)*sin(lr));let r=atan2(sin(lr)*cos(e)-Math.tan(br)*sin(e),cos(lr));return{ra:norm360(r*R2D),dec:d*R2D}}
function planetHelioLong(p,T){const L=p.L0+p.L1*T;const M=norm360(L-(p.Tp+p.Tp1*T));const E=M+p.e*R2D*sin(M*D2R);return norm360(p.Om+E)}
function planetPosition(key,jd,earthLong,earthR){const p=PLANETS[key],T=julianCenturies(jd),r=p.a,lam_p=planetHelioLong(p,T)*D2R,lam_e=earthLong*D2R;const x=r*cos(lam_p)-earthR*cos(lam_e),y=r*sin(lam_p)-earthR*sin(lam_e);const lam=atan2(y,x),dist=sqrt(x*x+y*y);const eq=eclToEq(norm360(lam*R2D),0);const ref={Mercury:0.0,Venus:-4.4,Mars:1.6,Jupiter:-2.7,Saturn:0.5}[key];const mag=ref+5*Math.log10(dist);return{ra:eq.ra,dec:eq.dec,mag,dist}}
function sunPosition(jd){const T=julianCenturies(jd);const L=norm360(280.46646+36000.76983*T),g=norm360(357.52911+35999.05029*T);const lam=norm360(L+1.915*sin(g*D2R)+0.020*sin(2*g*D2R));return eclToEq(lam,0)}
function moonPosition(jd){const T=julianCenturies(jd);const Lp=norm360(218.3165+481267.8813*T);const M=norm360(134.9629+477198.8676*T);const D=norm360(297.8502+445267.1114*T);const l=norm360(Lp+6.289*sin(M*D2R));const b=5.128*sin((93.272+483202.0188*T)*D2R);const eq=eclToEq(l,b);const sun=sunPosition(jd);const phaseSrc=sun.ra*D2R-eq.ra*D2R;const phase=(1-cos(phaseSrc))/2;return{ra:eq.ra,dec:eq.dec,phase}}
function computeEarth(jd){const T=julianCenturies(jd);const L=norm360(100.46435+35999.04968*T),g=norm360(357.52911+35999.05029*T);earthLongCache=norm360(L+1.915*sin(g*D2R)+0.020*sin(2*g*D2R));earthRCache=1.0}

const CX=500,CY=500,R=470;
function project(az,alt){if(alt<0)return null;const z=90-alt,phi=(az-180)*D2R,rr=R*(z/90);return{x:CX+rr*sin(phi),y:CY+rr*cos(phi)}}

const svg=document.getElementById("sky");
function clearSvg(){while(svg.firstChild)svg.removeChild(svg.firstChild)}
function el(tag,attrs){const e=document.createElementNS("http://www.w3.org/2000/svg",tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e}
function magToR(mag){return Math.max(0.6,6.0-mag*0.85)*respScale()}

let earthLongCache=null,earthRCache=null;

// Zoom, Pan, Responsive
const vs={cx:500,cy:500,size:1000};
let panning=false,didDrag=false,psx=0,psy=0,pscx=0,pscy=0;
function applyViewBox(){const s=vs.size/2;svg.setAttribute("viewBox",`${vs.cx-s} ${vs.cy-s} ${vs.size} ${vs.size}`)}
function respScale(){const w=svg.getBoundingClientRect().width;return Math.max(0.5,Math.min(3,1000/Math.max(300,w)))}
function updateFontScale(){svg.style.setProperty('--fs',respScale())}
svg.addEventListener("wheel",e=>{e.preventDefault();const R=svg.getBoundingClientRect();const rx=(e.clientX-R.left)/R.width,ry=(e.clientY-R.top)/R.height;const wx=vs.cx-vs.size/2+rx*vs.size,wy=vs.cy-vs.size/2+ry*vs.size;const f=e.deltaY>0?1.15:1/1.15;const ns=Math.max(80,Math.min(4000,vs.size*f));vs.cx=wx+(vs.cx-wx)*(ns/vs.size);vs.cy=wy+(vs.cy-wy)*(ns/vs.size);vs.size=ns;applyViewBox()},{passive:false});
svg.addEventListener("pointerdown",e=>{if(e.target.tagName==="text"||e.target.closest("text"))return;panning=true;didDrag=false;psx=e.clientX;psy=e.clientY;pscx=vs.cx;pscy=vs.cy;svg.setPointerCapture(e.pointerId);svg.classList.add("grabbing")});
svg.addEventListener("pointermove",e=>{if(!panning)return;const R=svg.getBoundingClientRect(),scale=vs.size/R.width;const dx=e.clientX-psx,dy=e.clientY-psy;if(Math.abs(dx)>3||Math.abs(dy)>3)didDrag=true;vs.cx=pscx-dx*scale;vs.cy=pscy-dy*scale;applyViewBox()});
svg.addEventListener("pointerup",()=>{panning=false;svg.classList.remove("grabbing")});
svg.addEventListener("pointercancel",()=>{panning=false;svg.classList.remove("grabbing")});

function drawGrid(){
  if(!TOGGLES.grid)return;
  svg.appendChild(el("circle",{cx:CX,cy:CY,r:R,fill:"none",stroke:"#2f3e66","stroke-width":2}));
  [30,60].forEach(alt=>{const r=R*((90-alt)/90);svg.appendChild(el("circle",{cx:CX,cy:CY,r:r,fill:"none",stroke:"#1d2746","stroke-width":1}));const t=el("text",{x:CX+4,y:CY-r+12,class:"grid-label"});t.textContent=alt+"°";svg.appendChild(t)});
  [["南",180],["北",0],["東",90],["西",270]].forEach(([n,az])=>{const p=project(az,0.01),p2=project(az,89);svg.appendChild(el("line",{x1:p2.x,y1:p2.y,x2:p.x,y2:p.y,stroke:"#1d2746","stroke-width":1}));const t=el("text",{x:p.x,y:p.y+(az===0?-6:14),class:"grid-label","text-anchor":"middle"});t.textContent=n;svg.appendChild(t)});
}

function drawConstellationLines(lst,lat){
  if(!TOGGLES.lines)return;
  const g=el("g",{id:"conLines",stroke:"#243056","stroke-width":1,opacity:0.7});
  CONSTELLATION_LINES.forEach(([i,j])=>{const s1=STARS[i],s2=STARS[j];if(!s1||!s2)return;const h1=eqToHorizon(s1.ra,s1.dec,lst,lat),h2=eqToHorizon(s2.ra,s2.dec,lst,lat);const p1=project(h1.az,h1.alt),p2=project(h2.az,h2.alt);if(p1&&p2)g.appendChild(el("line",{class:"con-line","data-con":s1.con,x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y}))});
  svg.appendChild(g);
}

function drawConstellationNames(lst,lat){
  if(!TOGGLES.names)return;
  const lang=document.getElementById("lang").value;
  const g=el("g",{});
  const cons={};
  STARS.forEach(s=>{if(!cons[s.con])cons[s.con]={ra:0,dec:0,c:0};cons[s.con].ra+=s.ra;cons[s.con].dec+=s.dec;cons[s.con].c++});
  for(const k in cons){const c=cons[k];c.ra/=c.c;c.dec/=c.c}
  for(const k in CON_NAMES){
    if(!cons[k])continue;
    const c=cons[k];const h=eqToHorizon(c.ra,c.dec,lst,lat);if(h.alt<=0)continue;
    const p=project(h.az,h.alt);if(!p)continue;
    const t=el("text",{x:p.x,y:p.y-6,class:"con-label","data-con":k});t.textContent=CON_NAMES[k][lang]||CON_NAMES[k].en;g.appendChild(t);
  }
  svg.appendChild(g);
}

function drawStars(jd,lst,lat,magLimit){
  const showLabels=TOGGLES.labels;
  const gStars=el("g",{});
  let cnt=0;
  STARS.forEach(s=>{
    const h=eqToHorizon(s.ra,s.dec,lst,lat);if(h.alt<=0||s.mag>magLimit)return;
    const p=project(h.az,h.alt);if(!p)return;
    cnt++;
    const c=el("circle",{cx:p.x,cy:p.y,r:magToR(s.mag),fill:"#ffffff",opacity:Math.min(1,0.4+s.mag*-0.1+0.7)});
    gStars.appendChild(c);
    if(showLabels&&s.mag<=2.0&&s.name){const t=el("text",{x:p.x+4,y:p.y-4,class:"star-label"});t.textContent=starLabel(s);gStars.appendChild(t)}
  });
  svg.appendChild(gStars);
  return cnt;
}

function drawPlanets(jd,lst,lat,magLimit){
  if(!TOGGLES.planets)return;
  const lang=document.getElementById("lang").value;
  const g=el("g",{});
  for(const key in PLANETS){const pp=planetPosition(key,jd,earthLongCache,earthRCache);if(pp.mag>magLimit)continue;const h=eqToHorizon(pp.ra,pp.dec,lst,lat);if(h.alt<=0)continue;const p=project(h.az,h.alt);if(!p)continue;const c=el("circle",{cx:p.x,cy:p.y,r:6,fill:PLANETS[key].color,stroke:"#000","stroke-width":1});g.appendChild(c);const t=el("text",{x:p.x+8,y:p.y+4,class:"planet-label",fill:PLANETS[key].color});t.textContent=PLANETS[key].sym+" "+(lang==="cn"?PLANETS[key].cn:PLANETS[key].name);g.appendChild(t)}
  svg.appendChild(g);
}

function drawSun(jd,lst,lat){const sun=sunPosition(jd);const h=eqToHorizon(sun.ra,sun.dec,lst,lat);const p=project(h.az,h.alt);if(!p)return;const c=el("circle",{cx:p.x,cy:p.y,r:9,fill:"#ffd35a",stroke:"#ffec9e","stroke-width":2});svg.appendChild(c);const t=el("text",{x:p.x+10,y:p.y+4,class:"planet-label",fill:"#ffd35a"});t.textContent="☉ 太陽";svg.appendChild(t)}

function drawMoon(jd,lst,lat){
  const m=moonPosition(jd);const h=eqToHorizon(m.ra,m.dec,lst,lat);if(h.alt<=0)return;const p=project(h.az,h.alt);if(!p)return;
  const g=el("g",{});
  const c=el("circle",{cx:p.x,cy:p.y,r:8,fill:"#c8d8e8",stroke:"#fff","stroke-width":1.5,opacity:0.9});g.appendChild(c);
  const isWaxing=m.phase<0.5;
  if(m.phase>0.02&&m.phase<0.98){const dir=isWaxing?1:-1;const cx=p.x+dir*(8-3);g.appendChild(el("ellipse",{cx:cx,cy:p.y,rx:3,ry:7,fill:isWaxing?"#a0b8d0":"#c8d8e8"}))}
  const t=el("text",{x:p.x+11,y:p.y+4,class:"planet-label",fill:"#c8d8e8"});t.textContent=document.getElementById("lang").value==="cn"?"☽ 月亮":"☽ Moon";g.appendChild(t);
  svg.appendChild(g);
}

function update(){
  const mins=+document.getElementById("time").value;const hh=Math.floor(mins/60),mm=mins%60;
  document.getElementById("clock").textContent=String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
  const y=+document.getElementById("year").value,m=+document.getElementById("month").value,d=+document.getElementById("day").value;
  const lon=+document.getElementById("lon").value,lat=+document.getElementById("lat").value;
  const magLimit=+document.getElementById("magLimit").value;document.getElementById("magVal").textContent=magLimit.toFixed(1);
  const utHours=hh+mm/60-(lon/15);const jd=julianDay(y,m,d,utHours);
  computeEarth(jd);const lst=localSiderealTime(jd,lon);
  clearSvg();
  drawGrid();
  drawConstellationLines(lst,lat);
  drawConstellationNames(lst,lat);
  const cnt=drawStars(jd,lst,lat,magLimit);
  drawPlanets(jd,lst,lat,magLimit);
  drawSun(jd,lst,lat);
  drawMoon(jd,lst,lat);
  const lstH=Math.floor(lst/15),lstM=Math.floor((lst/15-lstH)*60);
  document.getElementById("lstVal").textContent=String(lstH).padStart(2,"0")+"h "+String(lstM).padStart(2,"0")+"m";
  document.getElementById("starCount").textContent=cnt;
  const moon=moonPosition(jd);const phasePct=Math.round(moon.phase*100);
  document.getElementById("moonInfo").innerHTML="月相 <b>"+phasePct+"%</b>";
  document.getElementById("legend").innerHTML="<b>星等 ≤ "+magLimit.toFixed(1)+"</b><br>白點=恆星 · 彩色=行星<br>☉=太陽 · ☽=月亮 · 中心=天頂<br>外圈=地平線";
}

["year","month","day","lon","lat","magLimit","time","lang"].forEach(id=>{document.getElementById(id).addEventListener("input",update)});

document.getElementById("nowBtn").addEventListener("click",()=>{

});

function initCities(){
  const sel=document.getElementById("city");
  CITIES.forEach((c,i)=>{const o=document.createElement("option");o.value=i;o.textContent=c.name;sel.appendChild(o)});
  sel.addEventListener("change",()=>{const c=CITIES[+sel.value];document.getElementById("lat").value=c.lat.toFixed(2);document.getElementById("lon").value=c.lon.toFixed(2);update()});
}

document.addEventListener("keydown",e=>{
  const ET=new Set(["input","select","textarea"]);
  if(ET.has(e.target.tagName.toLowerCase()))return;
  if(e.key==="ArrowLeft"||e.key==="ArrowRight"){const sl=document.getElementById("time");sl.value=Math.max(0,Math.min(1440,+sl.value+(e.key==="ArrowRight"?10:-10)));update();e.preventDefault()}
  if(e.key==="ArrowUp"||e.key==="ArrowDown"){const sl=document.getElementById("magLimit");sl.value=Math.min(6.5,Math.max(1,+sl.value+(e.key==="ArrowUp"?0.5:-0.5)));update();e.preventDefault()}
  if(e.key==="g"||e.key==="G"){const btn=document.querySelector('[data-toggle="grid"]');btn.click()}
  if(e.key==="l"||e.key==="L"){const btn=document.querySelector('[data-toggle="labels"]');btn.click()}
  if(e.key==="c"||e.key==="C"){const btn=document.querySelector('[data-toggle="lines"]');btn.click()}
});

  function unzoom(t){if(t)t.classList.remove("label-zoom")}
  function highlightCon(con,on){if(!con)return;document.querySelectorAll("#conLines .con-line[data-con='"+con+"']").forEach(l=>l.classList.toggle("highlight",on))}
  function handleOver(e){const t=e.target;if(isLabel(t)){zoom(t);if(t.classList.contains("con-label"))highlightCon(t.dataset.con,true)}}
  function handleOut(e){const t=e.target;if(isLabel(t)){unzoom(t);if(t.classList.contains("con-label"))highlightCon(t.dataset.con,false)}}
  svg.addEventListener("mouseover",handleOver);
  svg.addEventListener("mouseout",handleOut);
  svg.addEventListener("click",e=>{if(didDrag){didDrag=false;return}const t=e.target;if(isLabel(t)){if(pinned===t){unzoom(t);if(t.classList.contains("con-label"))highlightCon(t.dataset.con,false);pinned=null}else{if(pinned){unzoom(pinned);if(pinned.classList.contains("con-label"))highlightCon(pinned.dataset.con,false)}zoom(t);if(t.classList.contains("con-label"))highlightCon(t.dataset.con,true);pinned=t}}else if(pinned){unzoom(pinned);if(pinned.classList.contains("con-label"))highlightCon(pinned.dataset.con,false);pinned=null}});
})();

const now=new Date();document.getElementById("time").value=now.getHours()*60+now.getMinutes();
initCities();
applyViewBox();
updateFontScale();
update();

document.getElementById("fsBtn").addEventListener("click",()=>{
  const m=document.getElementById("mapWrap"),a=document.getElementById("app");
  const fs=m.classList.toggle("fs");a.classList.toggle("fs");
  document.getElementById("fsBtn").textContent=fs?"✕ 退出":"⛶ 全螢幕";
  setTimeout(()=>{applyViewBox();update()},150);
});

window.addEventListener("resize",()=>{updateFontScale();update()});
</script>
</body>
